name: Publish verified release
on:
  workflow_dispatch:
    inputs:
      source_run:
        description: Successful Release workflow run containing mira-signed-acceptance
        required: true
        type: string
permissions:
  contents: write
  actions: read
  packages: write
concurrency:
  group: mira-release-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Verify source run provenance
        id: source
        env:
          SOURCE_RUN: ${{ inputs.source_run }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_RUN" =~ ^[0-9]+$ ]]
          gh api "repos/$GH_REPO/actions/runs/$SOURCE_RUN" > "$RUNNER_TEMP/source.json"
          jq -e --arg repo "$GH_REPO" '
            .status == "completed" and .conclusion == "success" and
            .path == ".github/workflows/release.yml" and
            .repository.full_name == $repo and .head_repository.full_name == $repo
          ' "$RUNNER_TEMP/source.json"
          commit=$(jq -r .head_sha "$RUNNER_TEMP/source.json")
          [[ "$commit" =~ ^[a-f0-9]{40}$ ]]
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.source.outputs.commit }}
      - name: Check optional runtime is published for split-release builds
        run: |
          # Older acceptance runs bundled Codex and have no independent lock.
          if [[ -f node/internal/codex-runtime.json ]]; then
            tag="codex-v$(jq -r .version node/internal/codex-runtime.json)"
            test "$(gh release view "$tag" --json isDraft --jq .isDraft)" = false
          fi
      - uses: actions/download-artifact@v4
        with:
          name: mira-signed-acceptance
          path: dist
          run-id: ${{ inputs.source_run }}
          github-token: ${{ github.token }}
      - name: Verify the signed acceptance artifacts
        id: verify
        env:
          SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
          SOURCE_RUN: ${{ inputs.source_run }}
        run: |
          set -euo pipefail
          version=$(<VERSION)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          tag="v$version"
          assets=(SHA256SUMS install.sh install.ps1
            "mira_${version}_linux_amd64.tar.gz" "mira_${version}_linux_arm64.tar.gz"
            "mira_${version}_windows_amd64.zip" "mira_${version}_android_arm64.apk")
          [[ $(find dist -mindepth 1 -maxdepth 1 | wc -l) == ${#assets[@]} ]]
          for asset in "${assets[@]}"; do test -s "dist/$asset"; done
          (cd dist && sha256sum -c SHA256SUMS)
          for asset in "${assets[@]:1}"; do
            expected=$(awk -v name="$asset" '$2 == name {print $1}' dist/SHA256SUMS)
            [[ "$expected" =~ ^[a-f0-9]{64}$ ]]
            [[ "$(sha256sum "dist/$asset" | awk '{print $1}')" == "$expected" ]]
          done
          cmp scripts/install.sh dist/install.sh
          cmp scripts/install.ps1 dist/install.ps1
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Verified $tag assets from run $SOURCE_RUN ($SOURCE_COMMIT)" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify publication identity before any container push
        id: publication
        env:
          SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
        run: bash scripts/release-state.sh prepare promote "$SOURCE_COMMIT" "$GITHUB_OUTPUT"

      - name: Stage or verify GitHub Release assets
        run: >-
          bash scripts/release-state.sh sync-assets
          "${{ steps.publication.outputs.tag }}"
          "${{ steps.publication.outputs.release_state }}" dist

      - name: Stage verified Linux images for the container
        run: |
          for architecture in amd64 arm64; do
            target="node/openssh/out/linux-$architecture"
            mkdir -p "$target"
            tar -xzf "dist/mira_${{ steps.verify.outputs.version }}_linux_${architecture}.tar.gz" \
              --strip-components=1 -C "$target"
          done

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check immutable version container state
        id: container
        run: >-
          bash scripts/release-container.sh check
          "ghcr.io/${{ github.repository }}:${{ steps.publication.outputs.version }}"
          "${{ steps.publication.outputs.recorded_digest }}"
          "$GITHUB_OUTPUT"

      - name: Build the unified Mira container under a staging tag
        id: staged_image
        uses: docker/build-push-action@v6
        if: steps.container.outputs.push == 'true'
        with:
          context: .
          file: node/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: MIRA_VERSION=${{ steps.verify.outputs.version }}
          tags: ${{ steps.container.outputs.staging_image }}

      - name: Publish the immutable version container
        id: version_image
        if: steps.container.outputs.push == 'true'
        run: >-
          bash scripts/release-container.sh promote
          "ghcr.io/${{ github.repository }}:${{ steps.publication.outputs.version }}"
          "${{ steps.container.outputs.staging_image }}"
          "${{ steps.staged_image.outputs.digest }}"
          "$GITHUB_OUTPUT"

      - name: Resolve the verified version container digest
        id: verified_image
        env:
          NEW_DIGEST: ${{ steps.version_image.outputs.digest }}
          EXISTING_DIGEST: ${{ steps.container.outputs.existing_digest }}
        run: |
          digest=${NEW_DIGEST:-$EXISTING_DIGEST}
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Attach the version container digest to the GitHub Release
        if: steps.container.outputs.needs_record == 'true'
        run: |
          bash scripts/release-container.sh record \
            "${{ steps.publication.outputs.tag }}" \
            "${{ steps.publication.outputs.digest_asset }}" \
            "${{ steps.verified_image.outputs.digest }}"

      - name: Publish the verified GitHub Release
        env:
          SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
          SOURCE_RUN: ${{ inputs.source_run }}
        run: |
          tag="${{ steps.publication.outputs.tag }}"
          gh release edit "$tag" --draft=false --latest
          echo "Published $tag from verified run $SOURCE_RUN ($SOURCE_COMMIT)" >> "$GITHUB_STEP_SUMMARY"

      - name: Move latest container tag after the GitHub Release is public
        run: |
          version="${{ steps.publication.outputs.version }}"
          docker buildx imagetools create \
            --tag "ghcr.io/${GITHUB_REPOSITORY}:latest" \
            "ghcr.io/${GITHUB_REPOSITORY}:${version}@${{ steps.verified_image.outputs.digest }}"
