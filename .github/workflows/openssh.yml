name: Embedded OpenSSH
on:
  workflow_call:
permissions:
  contents: read
jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-go@v7
        with:
          go-version-file: node/go.mod
          cache-dependency-path: node/go.sum
      - run: go -C node mod download
      - uses: docker/setup-buildx-action@v3
      - name: Cache native builder layers
        uses: docker/build-push-action@v6
        with:
          context: node/openssh/linux
          file: node/openssh/linux/Dockerfile
          load: true
          tags: mira-openssh-musl-builder:ci
          cache-from: type=gha,scope=mira-openssh-builder-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=mira-openssh-builder-${{ matrix.arch }}
      - name: Restore native inputs and container Go compiler cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/mira-openssh-build-cache
          key: openssh-linux-v1-${{ matrix.arch }}-${{ hashFiles('node/openssh/sources.json', 'node/openssh/linux/**', 'node/openssh/common/objects.mk', 'node/go.mod', 'node/go.sum') }}-${{ github.sha }}
          restore-keys: openssh-linux-v1-${{ matrix.arch }}-${{ hashFiles('node/openssh/sources.json', 'node/openssh/linux/**', 'node/openssh/common/objects.mk', 'node/go.mod', 'node/go.sum') }}-
      - name: Build single static image
        env:
          MIRA_OPENSSH_NATIVE_CACHE: ${{ runner.temp }}/mira-openssh-build-cache
          MIRA_OPENSSH_BUILDER_IMAGE: mira-openssh-musl-builder:ci
        run: |
          MIRA_OPENSSH_OUTPUT="$RUNNER_TEMP/bundle" bash node/openssh/build.sh linux
          node node/openssh/verify-package.mjs "$RUNNER_TEMP/bundle" linux '${{ matrix.arch }}'
          tar -C "$RUNNER_TEMP/bundle" -czf "$RUNNER_TEMP/openssh-linux-${{ matrix.arch }}.tar.gz" .
      - uses: actions/upload-artifact@v4
        with:
          name: openssh-linux-${{ matrix.arch }}
          path: ${{ runner.temp }}/openssh-linux-${{ matrix.arch }}.tar.gz

  windows-c:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Fingerprint native compiler and SDK
        id: native
        shell: pwsh
        run: |
          . node/openssh/windows/toolchain.ps1
          $compilerDir=Split-Path $MiraToolchain.Compiler
          $inputs=@($MiraToolchain.Compiler,$MiraToolchain.CMake)
          $inputs+=@('c1.dll','c1xx.dll','c2.dll','link.exe') | ForEach-Object { Join-Path $compilerDir $_ }
          $inputs+=@('libcmt.lib','vcruntime.lib') | ForEach-Object { Join-Path $MiraToolchain.Libraries[0] $_ }
          $inputs+=Join-Path $MiraToolchain.Libraries[1] 'ucrt.lib'
          $inputs+=Join-Path $MiraToolchain.Libraries[2] 'kernel32.lib'
          $fingerprint=$MiraToolchain.SdkVersion+"`n"+(($inputs | ForEach-Object { (Get-FileHash $_ -Algorithm SHA256).Hash }) -join "`n")
          $digest=[Security.Cryptography.SHA256]::Create().ComputeHash([Text.Encoding]::UTF8.GetBytes($fingerprint))
          "toolchain=$([BitConverter]::ToString($digest).Replace('-','').ToLowerInvariant())" >> $env:GITHUB_OUTPUT
      - name: Cache verified Windows native inputs
        id: native-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/windows-native.tar.gz
          key: openssh-windows-native-v1-${{ steps.native.outputs.toolchain }}-${{ hashFiles('node/openssh/sources.json', 'node/openssh/windows/**', '.github/workflows/openssh.yml') }}
      - name: Build native MSVC objects and static crypto
        if: steps.native-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $cache=Join-Path $env:RUNNER_TEMP 'openssh-sources'
          $work=Join-Path $env:RUNNER_TEMP 'mira-openssh-windows.ci'
          node node/openssh/fetch-sources.mjs $cache windows
          if ($LASTEXITCODE) { throw 'Source verification failed' }
          & node/openssh/windows/build-native.ps1 -Workspace $work -Cache $cache -Phase extract
          node node/openssh/windows/prepare.mjs (Join-Path $work 'source')
          if ($LASTEXITCODE) { throw 'Source adaptation failed' }
          & node/openssh/windows/build-native.ps1 -Workspace $work -Phase build
          tar -czf "$env:RUNNER_TEMP/windows-native.tar.gz" -C $work source deps/install deps/libressl-4.2.0 deps/zlib-1.3.2 deps/libfido2-1.16.0 deps/libcbor-0.14.0 sdk-libs dispatcher.obj
          if ($LASTEXITCODE) { throw 'Native artifact packaging failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: openssh-windows-c-inputs
          path: ${{ runner.temp }}/windows-native.tar.gz
          retention-days: 2

  windows-link:
    needs: windows-c
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-go@v7
        with:
          go-version-file: node/go.mod
          cache-dependency-path: node/go.sum
      - uses: actions/download-artifact@v4
        with:
          name: openssh-windows-c-inputs
          path: ${{ runner.temp }}/inputs
      - name: Link one PE image, never ship SDK or dependency DLLs
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm-18 lld-18 gcc-mingw-w64-x86-64 binutils-mingw-w64-x86-64
          work=$(mktemp -d /tmp/mira-openssh-windows.XXXXXX)
          tar -xzf "$RUNNER_TEMP/inputs/windows-native.tar.gz" -C "$work"
          MIRA_OPENSSH_GO_OUTPUT="$work/go-objects" bash node/openssh/windows/build-go.sh
          node node/openssh/windows/combine.mjs "$work/source" "$work/combined"
          node node/openssh/windows/link.mjs "$work"
          mkdir "$work/bin"
          cp "$work/mira-node.exe" "$work/bin/"
          node node/openssh/manifest.mjs "$work/bin" windows amd64 "$work"
          node node/openssh/verify-package.mjs "$work/bin" windows amd64
          tar -C "$work/bin" -czf "$RUNNER_TEMP/openssh-windows-amd64.tar.gz" .
      - uses: actions/upload-artifact@v4
        with:
          name: openssh-windows-amd64
          path: ${{ runner.temp }}/openssh-windows-amd64.tar.gz
