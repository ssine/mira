name: Server and Web CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/ci.yml"
      - "scripts/configure-ci-apt.sh"
      - "scripts/ci-start-server.sh"
      - "VERSION"
      - "compose*.yaml"
      - "scripts/check-version.mjs"
      - "node/go.mod"
      - "node/go.sum"
      - "node/internal/miraserver/**"
      - "node/internal/clauderuntime/**"
      - "node/internal/agenttools/**"
      - "node/internal/server_worker.go"
      - "node/internal/webassets/**"
      - "server/public/**"
      - "tests/**"
  pull_request:
    paths:
      - ".github/workflows/ci.yml"
      - "scripts/configure-ci-apt.sh"
      - "scripts/ci-start-server.sh"
      - "VERSION"
      - "compose*.yaml"
      - "scripts/check-version.mjs"
      - "node/go.mod"
      - "node/go.sum"
      - "node/internal/miraserver/**"
      - "node/internal/clauderuntime/**"
      - "node/internal/agenttools/**"
      - "node/internal/server_worker.go"
      - "node/internal/webassets/**"
      - "server/public/**"
      - "tests/**"

permissions:
  contents: read

# A newer push to the same pull request supersedes the older run. Runs on main
# are never cancelled so every merged commit keeps a complete result.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TEST_DATABASE_URL: postgresql://mira:mira-local@127.0.0.1:55432/mira

# Independent suites run as parallel jobs. Each job owns its PostgreSQL
# container and Server worker, so no suite depends on another suite's state.
jobs:
  static:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: actions/setup-go@v7
        with:
          go-version-file: node/go.mod
          cache-dependency-path: node/go.sum

      - name: Check version and Web sources
        run: |
          node scripts/check-version.mjs
          diff -qr --exclude vendor server/public node/internal/webassets/web
          for file in server/public/*.js tests/*.mjs; do node --check "$file"; done
          node --test \
            tests/mira_socket_test.mjs \
            tests/admin_session_ui_test.mjs \
            tests/account_status_test.mjs \
            tests/claude_conversations_test.mjs \
            tests/claude_lifecycle_test.mjs \
            tests/claude_cache_test.mjs \
            tests/account_recovery_test.mjs \
            tests/automatic_recovery_test.mjs \
            tests/recovery_notices_test.mjs \
            tests/account_overview_test.mjs \
            tests/account_history_cache_test.mjs \
            tests/quota_reference.mjs \
            tests/conversation_progress_test.mjs \
            tests/markdown_test.mjs \
            tests/file_preview_paths_test.mjs \
            tests/pwa_notifications_test.mjs \
            tests/thread_list_test.mjs \
            tests/thread_pages_test.mjs \
            tests/thread_title_test.mjs \
            tests/thread_interrupt_test.mjs \
            tests/thread_token_usage_test.mjs \
            tests/thread_reasoning_effort_test.mjs \
            tests/conversation_timeline_test.mjs \
            tests/reasoning_content_test.mjs \
            tests/trace_copy_test.mjs

      - name: Test native Go Server and embedded Web assets
        working-directory: node
        run: go test -race ./internal/miraserver/... ./internal/webassets/... ./internal/agenttools/... ./internal/clauderuntime/...

      - name: Check Python helpers
        run: python3 -m compileall -q tests

      - name: Validate Compose files
        env:
          DATABASE_URL: postgresql://mira:ci-only@postgres.example.internal:5432/mira
          MIRA_CODEX_STORE_ENDPOINT: https://mira.example.test
          MIRA_VERSION: 1.0.4
        run: |
          docker compose -f compose.yaml config --quiet
          docker compose -f compose.homeserver.yaml config --quiet

  postgres:
    name: postgres (${{ matrix.suite }})
    strategy:
      fail-fast: false
      matrix:
        suite: [core, claude]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: actions/setup-go@v7
        with:
          go-version-file: node/go.mod
          cache-dependency-path: node/go.sum

      - name: Test PostgreSQL migrations and read models
        env:
          SUITE: ${{ matrix.suite }}
        run: |
          docker compose -f compose.yaml up -d --wait postgres
          trap 'docker compose -f compose.yaml down -v' EXIT
          case "$SUITE" in
            core)
              MIRA_TEST_DATABASE_URL="$TEST_DATABASE_URL" go -C node test ./internal/miraserver/foundation
              MIRA_NODES_TEST_DATABASE_URL="$TEST_DATABASE_URL" go -C node test ./internal/miraserver/nodes
              MIRA_VIEWS_TEST_DATABASE_URL="$TEST_DATABASE_URL" go -C node test ./internal/miraserver/views
              MIRA_IMPORT_ADAPTER_TEST_DATABASE_URL="$TEST_DATABASE_URL" MIRA_HISTORY_UPLOAD_TEST_DATABASE_URL="$TEST_DATABASE_URL" go -C node test ./internal/miraserver ./internal/miraserver/imports ./internal/miraserver/channel
              ;;
            claude)
              MIRA_CLAUDE_SDK_TEST=1 MIRA_HISTORY_UPLOAD_TEST_DATABASE_URL="$TEST_DATABASE_URL" go -C node test ./internal/miraserver -run '^TestClaude' -count=1 -timeout 5m
              ;;
            *) echo "unknown suite $SUITE" >&2; exit 1 ;;
          esac

  e2e:
    name: e2e (${{ matrix.suite }})
    strategy:
      fail-fast: false
      matrix:
        suite: [console, sites]
    runs-on: ubuntu-24.04
    env:
      DATABASE_URL: postgresql://mira:mira-local@127.0.0.1:55432/mira
      MIRA_SECURE_COOKIES: "false"
      LISTEN_HOST: 127.0.0.1
      MIRA_NODE_PREVIEW_DOMAIN: preview.localhost
      MIRA_NODE_SITE_STREAM_BUDGET: "3"
      MIRA_NODE_PREVIEW_INGRESSES: '[{"consoleOrigin":"http://127.0.0.1:8787","previewOrigin":"http://preview.localhost:8787"},{"consoleOrigin":"http://direct.console.example.test:24443","previewOrigin":"http://preview.direct.localhost:34443"}]'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: actions/setup-go@v7
        with:
          go-version-file: node/go.mod
          cache-dependency-path: node/go.sum

      - name: Test Go Server, Web, authentication, and Node channel
        env:
          SUITE: ${{ matrix.suite }}
        run: |
          docker compose -f compose.yaml up -d --wait postgres
          go -C node build -o "$RUNNER_TEMP/mira" ./cmd/mira
          printf '%s\n' 'mira-local-admin-password' | "$RUNNER_TEMP/mira" server admin set-password admin
          server_pid=$(bash scripts/ci-start-server.sh "$RUNNER_TEMP/mira" "$RUNNER_TEMP/mira-server.log")
          trap 'kill "$server_pid" >/dev/null 2>&1 || true; docker compose -f compose.yaml down -v' EXIT
          case "$SUITE" in
            console)
              MIRA_TEST_BINARY="$RUNNER_TEMP/mira" node tests/schedules_e2e.mjs
              MIRA_NODE_TRANSPORT=https MIRA_TEST_BINARY="$RUNNER_TEMP/mira" node tests/schedules_e2e.mjs
              node tests/web_console_e2e.mjs
              MIRA_NODE_TRANSPORT=https node tests/web_console_e2e.mjs
              MIRA_NODE_TRANSPORT=https MIRA_TEST_BINARY="$RUNNER_TEMP/mira" MIRA_TEST_PREVIEW_INGRESSES="$MIRA_NODE_PREVIEW_INGRESSES" node tests/file_preview_e2e.mjs
              ;;
            sites)
              npm ci --ignore-scripts
              MIRA_SITE_RECLAIM_TEST=true MIRA_SITE_POOL_WAIT_MS=35000 MIRA_TEST_BINARY="$RUNNER_TEMP/mira" node tests/port_sites_e2e.mjs
              MIRA_NODE_TRANSPORT=https MIRA_SITE_RECLAIM_TEST=true MIRA_TEST_BINARY="$RUNNER_TEMP/mira" node tests/port_sites_e2e.mjs
              kill "$server_pid"
              wait "$server_pid" 2>/dev/null || true
              server_pid=$(MIRA_NODE_SITE_STREAM_BUDGET=128 bash scripts/ci-start-server.sh "$RUNNER_TEMP/mira" "$RUNNER_TEMP/mira-server-capacity.log")
              MIRA_NODE_SITE_STREAM_BUDGET=128 MIRA_SITE_PARALLEL_STREAMS=40 MIRA_TEST_BINARY="$RUNNER_TEMP/mira" node tests/port_sites_e2e.mjs
              ;;
            *) echo "unknown suite $SUITE" >&2; exit 1 ;;
          esac

  browser:
    name: browser (${{ matrix.shard }})
    # Keep the browser runner within pinned Playwright's supported platforms.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # Shards are balanced by observed duration. Every regression in the
        # former single list must appear in exactly one shard.
        include:
          - shard: activity
            tests: client_cache web_shell thread_menu thread_activity
          - shard: layout
            tests: thread_pages sidebar_swipe thread_token_usage
          - shard: conversation
            tests: thread_list thinking_activity thread_models codex_fast codex_accounts claude_accounts claude_plan_usage claude_questions claude_cache account_overview sidebar_layout composer_drafts transcript_images conversation_scroll trace_diagrams markdown recovery_notices conversation_index conversation_rail
    env:
      DATABASE_URL: postgresql://mira:mira-local@127.0.0.1:55432/mira
      MIRA_SECURE_COOKIES: "false"
      LISTEN_HOST: 127.0.0.1
      MIRA_NODE_PREVIEW_DOMAIN: preview.localhost
      # Matches the capacity Server the browser regressions previously shared.
      MIRA_NODE_SITE_STREAM_BUDGET: "128"
      MIRA_NODE_PREVIEW_INGRESSES: '[{"consoleOrigin":"http://127.0.0.1:8787","previewOrigin":"http://preview.localhost:8787"},{"consoleOrigin":"http://direct.console.example.test:24443","previewOrigin":"http://preview.direct.localhost:34443"}]'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: actions/setup-go@v7
        with:
          go-version-file: node/go.mod
          cache-dependency-path: node/go.sum

      - name: Install Playwright Chromium
        run: |
          npm install --prefix "$RUNNER_TEMP/mira-browser" --no-save playwright@1.58.2
          bash scripts/configure-ci-apt.sh
          "$RUNNER_TEMP/mira-browser/node_modules/.bin/playwright" install --with-deps chromium

      - name: Test Web console in a real browser
        env:
          TESTS: ${{ matrix.tests }}
        run: |
          docker compose -f compose.yaml up -d --wait postgres
          go -C node build -o "$RUNNER_TEMP/mira" ./cmd/mira
          printf '%s\n' 'mira-local-admin-password' | "$RUNNER_TEMP/mira" server admin set-password admin
          server_pid=$(bash scripts/ci-start-server.sh "$RUNNER_TEMP/mira" "$RUNNER_TEMP/mira-server.log")
          trap 'kill "$server_pid" >/dev/null 2>&1 || true; docker compose -f compose.yaml down -v' EXIT
          browser_status=0
          for test in $TESTS; do
            MIRA_SERVER_URL=http://127.0.0.1:8787 node "tests/${test}_browser.mjs" "$RUNNER_TEMP/mira-browser/node_modules/playwright/index.mjs" || browser_status=1
          done
          exit "$browser_status"
