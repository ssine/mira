name: Server CI

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/ci.yml"
      - "CODEX_VERSION"
      - "VERSION"
      - "compose*.yaml"
      - "scripts/check-version.mjs"
      - "server/**"
      - "tests/**"
  pull_request:
    paths:
      - ".github/workflows/ci.yml"
      - "CODEX_VERSION"
      - "VERSION"
      - "compose*.yaml"
      - "scripts/check-version.mjs"
      - "server/**"
      - "tests/**"

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install server dependencies
        run: npm ci --prefix server

      - name: Check Server and Web code
        run: |
          npm run check --prefix server
          for file in tests/*.mjs; do node --check "$file"; done

      - name: Check Python helpers
        run: python3 -m compileall -q tests

      - name: Validate Compose files
        env:
          POSTGRES_PASSWORD: ci-only-password
        run: |
          docker compose -f compose.yaml config --quiet
          docker compose -f compose.homeserver.yaml config --quiet

      - name: Build production Server container
        run: docker build -t mira-control:ci ./server

      - name: Test Server, Web, authentication, and session transfer
        env:
          MIRA_SECURE_COOKIES: "false"
        run: |
          docker compose -f compose.yaml up -d --wait postgres
          trap 'docker rm -f mira-ci-control >/dev/null 2>&1 || true; docker compose -f compose.yaml down -v' EXIT
          printf '%s\n' 'mira-local-admin-password' | npm run admin --prefix server -- set-password admin
          docker run -d --name mira-ci-control --network host \
            -e DATABASE_URL=postgresql://mira:mira-local@127.0.0.1:55432/mira \
            -e MIRA_SECURE_COOKIES=false -e LISTEN_HOST=127.0.0.1 \
            mira-control:ci
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:8787/healthz >/dev/null; then break; fi
            if [ "$attempt" -eq 40 ]; then docker logs mira-ci-control; exit 1; fi
            sleep 0.5
          done
          node tests/auth_enrollment_e2e.mjs
          node tests/web_console_e2e.mjs
          MIRA_TRANSFER_TEST_DATABASE_URL=postgresql://mira:mira-local@127.0.0.1:55432/mira node tests/session_transfer_e2e.mjs
