name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - uses: actions/setup-go@v7
        with:
          go-version-file: android-native-agent/go.mod
          cache-dependency-path: android-native-agent/go.sum

      - name: Install server dependencies
        run: npm ci --prefix server

      - name: Check JavaScript
        run: |
          npm run check --prefix server
          npm run check --prefix node-agent
          for file in runtime/*.mjs; do node --check "$file"; done

      - name: Check Python
        run: python3 -m compileall -q runtime

      - name: Test Android native agent
        working-directory: android-native-agent
        run: go test ./...

      - name: Validate Compose files
        env:
          THREAD_STORE_TOKEN: ci-only-token
          POSTGRES_PASSWORD: ci-only-password
        run: |
          docker compose -f compose.yaml config --quiet
          docker compose -f compose.homeserver.yaml config --quiet
