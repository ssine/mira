name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - uses: actions/setup-go@v7
        with:
          go-version-file: node/go.mod
          cache-dependency-path: node/go.sum

      - name: Install server dependencies
        run: npm ci --prefix server

      - name: Check JavaScript
        run: |
          npm run check --prefix server
          for file in tests/*.mjs; do node --check "$file"; done
          node --test tests/node_channel_test.mjs tests/ssh_relay_test.mjs

      - name: Check Python
        run: python3 -m compileall -q tests

      - name: Test Mira Node
        working-directory: node
        run: go test ./...

      - name: Cross-compile Mira Node
        working-directory: node
        run: |
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -o /tmp/mira-node.exe ./cmd/mira-node
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -o /tmp/mira.exe ./cmd/mira
          GOOS=android GOARCH=arm64 CGO_ENABLED=0 go build -o /tmp/mira-node-android ./cmd/mira-node

      - name: Build release archives
        run: |
          ./scripts/build-release.sh dist
          node tests/installers_e2e.mjs

      - name: Validate Compose files
        env:
          POSTGRES_PASSWORD: ci-only-password
        run: |
          docker compose -f compose.yaml config --quiet
          docker compose -f compose.homeserver.yaml config --quiet

      - name: Test authentication and Node enrollment
        env:
          MIRA_SECURE_COOKIES: "false"
        run: |
          docker compose -f compose.yaml up -d --wait postgres
          trap 'docker compose -f compose.yaml down -v' EXIT
          printf '%s\n' 'mira-local-admin-password' | npm run admin --prefix server -- set-password admin
          npm start --prefix server > /tmp/mira-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; docker compose -f compose.yaml down -v' EXIT
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:8787/healthz >/dev/null; then break; fi
            if [ "$attempt" -eq 40 ]; then cat /tmp/mira-server.log; exit 1; fi
            sleep 0.5
          done
          node tests/auth_enrollment_e2e.mjs
          node tests/web_console_e2e.mjs
          node tests/ssh_e2e.mjs

  windows-native:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: node/go.mod
          cache-dependency-path: node/go.sum
      - name: Test native Windows capabilities and ConPTY
        working-directory: node
        run: go test -v ./...
      - name: Repeat fast-exit SSH ConPTY output regression
        working-directory: node
        run: go test -run '^TestSSHNativePTY$' -count 100 -timeout 120s ./internal/node
