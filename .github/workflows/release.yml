name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish a release (false builds signed acceptance artifacts only)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  embedded-openssh:
    uses: ./.github/workflows/openssh.yml
  release:
    needs: embedded-openssh
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: actions/setup-go@v7
        with:
          go-version-file: node/go.mod
          cache-dependency-path: node/go.sum

      - name: Check the independent Codex release is available before publishing
        if: github.ref_type == 'tag' || inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(node -p "'codex-v' + require('./node/internal/codex-runtime.json').version")
          test "$(gh release view "$tag" --json isDraft --jq .isDraft)" = false

      - name: Validate unified version
        shell: bash
        run: |
          node scripts/check-version.mjs
          version=$(<VERSION)
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" != "v${version}" ]]; then
            echo "tag ${GITHUB_REF_NAME} does not match VERSION ${version}" >&2
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          pattern: openssh-*-amd64
          path: ${{ runner.temp }}/native
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: openssh-linux-arm64
          path: ${{ runner.temp }}/native
      - name: Stage verified native bundles
        shell: bash
        run: |
          for target in linux-amd64 linux-arm64 windows-amd64; do
            mkdir -p "node/openssh/out/$target"
            tar -xzf "$RUNNER_TEMP/native/openssh-$target.tar.gz" -C "node/openssh/out/$target"
          done

      - name: Build desktop Node and CLI artifacts
        run: |
          go -C node test ./...
          ./scripts/build-release.sh dist
          node tests/installers_e2e.mjs

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build signed Android APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.MIRA_ANDROID_KEYSTORE_BASE64 }}
          MIRA_ANDROID_STORE_PASSWORD: ${{ secrets.MIRA_ANDROID_STORE_PASSWORD }}
          MIRA_ANDROID_KEY_ALIAS: ${{ secrets.MIRA_ANDROID_KEY_ALIAS }}
          MIRA_ANDROID_KEY_PASSWORD: ${{ secrets.MIRA_ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          if [[ -z "${ANDROID_KEYSTORE_BASE64}" ]]; then
            echo "MIRA_ANDROID_KEYSTORE_BASE64 is required" >&2
            exit 1
          fi
          printf '%s' "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > "${RUNNER_TEMP}/mira-release.jks"
          export MIRA_ANDROID_KEYSTORE="${RUNNER_TEMP}/mira-release.jks"
          ndk_version=$(<node/android/NDK_VERSION)
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;${ndk_version}"
          gradle -p node/android --no-daemon assembleRelease
          version=$(<VERSION)
          cp node/android/build/outputs/apk/release/mira-node-release.apk "dist/mira_${version}_android_arm64.apk"
          (cd dist && sha256sum "mira_${version}_android_arm64.apk" >> SHA256SUMS)

      - uses: actions/upload-artifact@v4
        with:
          name: mira-signed-acceptance
          path: dist/*
          retention-days: 7

      - name: Publish GitHub Release
        if: github.ref_type == 'tag' || inputs.publish == true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version=$(<VERSION)
          tag="v${version}"
          if [[ "${GITHUB_REF_TYPE}" != "tag" ]]; then
            git tag "${tag}"
            git push origin "${tag}"
          fi
          gh release create "${tag}" dist/* \
            --verify-tag \
            --generate-notes \
            --title "Mira ${version}"
