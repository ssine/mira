name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish a release (false builds signed acceptance artifacts only)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  codex:
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
            package: mira-codex-package-linux-amd64
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            package: mira-codex-package-windows-amd64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - name: Prepare patched Codex source
        shell: bash
        run: |
          set -euo pipefail
          codex_version=$(<CODEX_VERSION)
          git clone --depth 1 --branch "rust-v${codex_version}" https://github.com/openai/codex.git upstream-codex
          git -C upstream-codex apply "$GITHUB_WORKSPACE/patches/codex/0001-feat-thread-store-add-remote-PostgreSQL-adapter.patch"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - if: runner.os == 'Linux'
        uses: mlugg/setup-zig@v2
        with:
          version: 0.14.0
          use-cache: false

      - name: Install Linux MUSL toolchain
        if: runner.os == 'Linux'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends binutils libcap-dev pkg-config
          bash upstream-codex/.github/scripts/install-musl-build-tools.sh

      - name: Configure verified Codex rusty_v8 artifacts
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          version=$(python upstream-codex/.github/scripts/rusty_v8_bazel.py resolved-v8-crate-version)
          base_url="https://github.com/openai/codex/releases/download/rusty-v8-v${version}"
          artifact_dir="${RUNNER_TEMP}/mira-rusty-v8"
          profile=ptrcomp_sandbox_release
          mkdir -p "$artifact_dir"
          if [[ "$TARGET" == *windows* ]]; then
            archive="rusty_v8_${profile}_${TARGET}.lib.gz"
          else
            archive="librusty_v8_${profile}_${TARGET}.a.gz"
          fi
          binding="src_binding_${profile}_${TARGET}.rs"
          checksums="rusty_v8_${profile}_${TARGET}.sha256"
          curl -fsSL "$base_url/$archive" -o "$artifact_dir/$archive"
          curl -fsSL "$base_url/$binding" -o "$artifact_dir/$binding"
          curl -fsSL "$base_url/$checksums" -o "$artifact_dir/$checksums"
          (cd "$artifact_dir" && tr -d '\r' < "$checksums" | sha256sum -c -)
          echo "RUSTY_V8_ARCHIVE=$artifact_dir/$archive" >> "$GITHUB_ENV"
          echo "RUSTY_V8_SRC_BINDING_PATH=$artifact_dir/$binding" >> "$GITHUB_ENV"

      - name: Build Linux sandbox resource
        if: runner.os == 'Linux'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          export AWS_LC_SYS_NO_JITTER_ENTROPY=1
          target_no_jitter="AWS_LC_SYS_NO_JITTER_ENTROPY_${TARGET//-/_}"
          export "$target_no_jitter=1"
          cargo build --manifest-path upstream-codex/codex-rs/Cargo.toml \
            --target "$TARGET" --release --locked --bin bwrap
          bwrap="upstream-codex/codex-rs/target/${TARGET}/release/bwrap"
          strip --strip-debug --strip-unneeded "$bwrap"
          digest=$(sha256sum "$bwrap" | awk '{print $1}')
          echo "CODEX_BWRAP_SHA256=$digest" >> "$GITHUB_ENV"

      - name: Build Mira-compatible Codex
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          build_args=(--bin codex --bin codex-code-mode-host)
          if [[ "$TARGET" == "x86_64-pc-windows-msvc" ]]; then
            export LIBSQLITE3_FLAGS=SQLITE_DISABLE_INTRINSIC
            build_args+=(--bin codex-command-runner --bin codex-windows-sandbox-setup)
          else
            export AWS_LC_SYS_NO_JITTER_ENTROPY=1
            target_no_jitter="AWS_LC_SYS_NO_JITTER_ENTROPY_${TARGET//-/_}"
            export "$target_no_jitter=1"
          fi
          cargo build --manifest-path upstream-codex/codex-rs/Cargo.toml \
            --target "$TARGET" --release --locked "${build_args[@]}"

      - name: Assemble canonical Codex package
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          PACKAGE: ${{ matrix.package }}
          CODEX_REPO_ROOT: ${{ github.workspace }}/upstream-codex
        run: |
          set -euo pipefail
          codex_version=$(<CODEX_VERSION)
          release_dir="$GITHUB_WORKSPACE/upstream-codex/codex-rs/target/${TARGET}/release"
          suffix=""
          [[ "$TARGET" == *windows* ]] && suffix=".exe"
          arguments=(
            --target "$TARGET"
            --package-version "$codex_version"
            --package-dir "$GITHUB_WORKSPACE/$PACKAGE"
            --entrypoint-bin "$release_dir/codex${suffix}"
            --code-mode-host-bin "$release_dir/codex-code-mode-host${suffix}"
          )
          if [[ "$TARGET" == *windows* ]]; then
            arguments+=(
              --codex-command-runner-bin "$release_dir/codex-command-runner.exe"
              --codex-windows-sandbox-setup-bin "$release_dir/codex-windows-sandbox-setup.exe"
            )
          else
            arguments+=(--bwrap-bin "$release_dir/bwrap")
          fi
          python upstream-codex/scripts/build_codex_package.py "${arguments[@]}"

      - uses: actions/upload-artifact@v4
        with:
          name: mira-codex-${{ matrix.target }}
          path: ${{ matrix.package }}
          if-no-files-found: error
          retention-days: 7

  release:
    needs: codex
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: actions/setup-go@v7
        with:
          go-version-file: node/go.mod
          cache-dependency-path: node/go.sum

      - uses: actions/download-artifact@v4
        with:
          pattern: mira-codex-*
          path: codex-dist

      - name: Validate unified version
        shell: bash
        run: |
          node scripts/check-version.mjs
          version=$(<VERSION)
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" != "v${version}" ]]; then
            echo "tag ${GITHUB_REF_NAME} does not match VERSION ${version}" >&2
            exit 1
          fi

      - name: Build desktop Node and CLI artifacts
        env:
          MIRA_CODEX_PACKAGE_LINUX_AMD64: ${{ github.workspace }}/codex-dist/mira-codex-x86_64-unknown-linux-musl
          MIRA_CODEX_PACKAGE_WINDOWS_AMD64: ${{ github.workspace }}/codex-dist/mira-codex-x86_64-pc-windows-msvc
          MIRA_REQUIRE_CODEX_BUNDLE: "true"
        run: |
          go -C node test ./...
          ./scripts/build-release.sh dist
          node tests/installers_e2e.mjs

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build signed Android APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.MIRA_ANDROID_KEYSTORE_BASE64 }}
          MIRA_ANDROID_STORE_PASSWORD: ${{ secrets.MIRA_ANDROID_STORE_PASSWORD }}
          MIRA_ANDROID_KEY_ALIAS: ${{ secrets.MIRA_ANDROID_KEY_ALIAS }}
          MIRA_ANDROID_KEY_PASSWORD: ${{ secrets.MIRA_ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          if [[ -z "${ANDROID_KEYSTORE_BASE64}" ]]; then
            echo "MIRA_ANDROID_KEYSTORE_BASE64 is required" >&2
            exit 1
          fi
          printf '%s' "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > "${RUNNER_TEMP}/mira-release.jks"
          export MIRA_ANDROID_KEYSTORE="${RUNNER_TEMP}/mira-release.jks"
          ndk_version=$(<node/android/NDK_VERSION)
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;${ndk_version}"
          gradle -p node/android --no-daemon assembleRelease
          version=$(<VERSION)
          cp node/android/app/build/outputs/apk/release/app-release.apk "dist/mira_${version}_android_arm64.apk"
          (cd dist && sha256sum "mira_${version}_android_arm64.apk" >> SHA256SUMS)

      - uses: actions/upload-artifact@v4
        with:
          name: mira-signed-acceptance
          path: dist/*
          retention-days: 7

      - name: Publish GitHub Release
        if: github.ref_type == 'tag' || inputs.publish == true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version=$(<VERSION)
          tag="v${version}"
          if [[ "${GITHUB_REF_TYPE}" != "tag" ]]; then
            git tag "${tag}"
            git push origin "${tag}"
          fi
          gh release create "${tag}" dist/* \
            --verify-tag \
            --generate-notes \
            --title "Mira ${version}"
