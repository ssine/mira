name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish a release (false builds signed acceptance artifacts only)"
        type: boolean
        default: false

permissions:
  contents: write
  packages: write

concurrency:
  group: mira-release-publication
  cancel-in-progress: false

jobs:
  embedded-openssh:
    uses: ./.github/workflows/openssh.yml
  release:
    needs: embedded-openssh
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: actions/setup-go@v7
        with:
          go-version-file: node/go.mod
          cache-dependency-path: node/go.sum

      - name: Check the independent Codex release is available before publishing
        if: github.ref_type == 'tag' || inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(node -p "'codex-v' + require('./node/internal/codex-runtime.json').version")
          test "$(gh release view "$tag" --json isDraft --jq .isDraft)" = false

      - name: Validate unified version
        id: version
        shell: bash
        run: |
          node scripts/check-version.mjs
          version=$(<VERSION)
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" != "v${version}" ]]; then
            echo "tag ${GITHUB_REF_NAME} does not match VERSION ${version}" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          pattern: openssh-*-amd64
          path: ${{ runner.temp }}/native
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: openssh-linux-arm64
          path: ${{ runner.temp }}/native
      - name: Stage verified native bundles
        shell: bash
        run: |
          for target in linux-amd64 linux-arm64 windows-amd64; do
            mkdir -p "node/openssh/out/$target"
            tar -xzf "$RUNNER_TEMP/native/openssh-$target.tar.gz" -C "node/openssh/out/$target"
          done

      - name: Build unified Mira artifacts
        run: |
          npm ci --ignore-scripts
          diff -qr --exclude vendor server/public node/internal/webassets/web
          cmp node_modules/@xterm/xterm/lib/xterm.mjs node/internal/webassets/web/vendor/xterm.js
          cmp node_modules/@xterm/xterm/css/xterm.css node/internal/webassets/web/vendor/xterm.css
          cmp node_modules/@xterm/addon-fit/lib/addon-fit.mjs node/internal/webassets/web/vendor/xterm-addon-fit.js
          cmp node_modules/marked/lib/marked.esm.js node/internal/webassets/web/vendor/marked.js
          cmp node_modules/dompurify/dist/purify.es.mjs node/internal/webassets/web/vendor/dompurify.js
          node --test tests/release_publication_test.mjs
          go -C node test ./...
          ./scripts/build-release.sh dist
          node tests/installers_e2e.mjs

      - name: Validate the Node-free Mira container
        run: docker build --build-arg MIRA_VERSION="${{ steps.version.outputs.version }}" -f node/Dockerfile -t mira:release-check .

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build signed Android APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.MIRA_ANDROID_KEYSTORE_BASE64 }}
          MIRA_ANDROID_STORE_PASSWORD: ${{ secrets.MIRA_ANDROID_STORE_PASSWORD }}
          MIRA_ANDROID_KEY_ALIAS: ${{ secrets.MIRA_ANDROID_KEY_ALIAS }}
          MIRA_ANDROID_KEY_PASSWORD: ${{ secrets.MIRA_ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          if [[ -z "${ANDROID_KEYSTORE_BASE64}" ]]; then
            echo "MIRA_ANDROID_KEYSTORE_BASE64 is required" >&2
            exit 1
          fi
          printf '%s' "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > "${RUNNER_TEMP}/mira-release.jks"
          export MIRA_ANDROID_KEYSTORE="${RUNNER_TEMP}/mira-release.jks"
          ndk_version=$(<node/android/NDK_VERSION)
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;${ndk_version}"
          gradle -p node/android --no-daemon assembleRelease
          version=$(<VERSION)
          cp node/android/build/outputs/apk/release/mira-node-release.apk "dist/mira_${version}_android_arm64.apk"
          (cd dist && sha256sum "mira_${version}_android_arm64.apk" >> SHA256SUMS)

      - uses: actions/upload-artifact@v4
        with:
          name: mira-signed-acceptance
          path: dist/*
          retention-days: 7

      - name: Create the promotion draft for acceptance-only runs
        if: github.event_name == 'workflow_dispatch' && inputs.publish != true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: bash scripts/release-state.sh prepare draft "$GITHUB_SHA" "$GITHUB_OUTPUT"

      - name: Verify publication identity before any container push
        id: publication
        if: github.ref_type == 'tag' || inputs.publish == true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: bash scripts/release-state.sh prepare publish "$GITHUB_SHA" "$GITHUB_OUTPUT"

      - name: Stage or verify GitHub Release assets
        if: github.ref_type == 'tag' || inputs.publish == true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: >-
          bash scripts/release-state.sh sync-assets
          "${{ steps.publication.outputs.tag }}"
          "${{ steps.publication.outputs.release_state }}" dist

      - uses: docker/setup-qemu-action@v3
        if: github.ref_type == 'tag' || inputs.publish == true

      - uses: docker/setup-buildx-action@v3
        if: github.ref_type == 'tag' || inputs.publish == true

      - uses: docker/login-action@v3
        if: github.ref_type == 'tag' || inputs.publish == true
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check immutable version container state
        id: container
        if: github.ref_type == 'tag' || inputs.publish == true
        shell: bash
        run: >-
          bash scripts/release-container.sh check
          "ghcr.io/${{ github.repository }}:${{ steps.publication.outputs.version }}"
          "${{ steps.publication.outputs.recorded_digest }}"
          "$GITHUB_OUTPUT"

      - name: Build the unified Mira container under a staging tag
        id: staged_image
        uses: docker/build-push-action@v6
        if: (github.ref_type == 'tag' || inputs.publish == true) && steps.container.outputs.push == 'true'
        with:
          context: .
          file: node/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: MIRA_VERSION=${{ steps.version.outputs.version }}
          tags: ${{ steps.container.outputs.staging_image }}

      - name: Publish the immutable version container
        id: version_image
        if: (github.ref_type == 'tag' || inputs.publish == true) && steps.container.outputs.push == 'true'
        shell: bash
        run: >-
          bash scripts/release-container.sh promote
          "ghcr.io/${{ github.repository }}:${{ steps.publication.outputs.version }}"
          "${{ steps.container.outputs.staging_image }}"
          "${{ steps.staged_image.outputs.digest }}"
          "$GITHUB_OUTPUT"

      - name: Resolve the verified version container digest
        id: verified_image
        if: github.ref_type == 'tag' || inputs.publish == true
        env:
          NEW_DIGEST: ${{ steps.version_image.outputs.digest }}
          EXISTING_DIGEST: ${{ steps.container.outputs.existing_digest }}
        shell: bash
        run: |
          digest=${NEW_DIGEST:-$EXISTING_DIGEST}
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Attach the version container digest to the GitHub Release
        if: (github.ref_type == 'tag' || inputs.publish == true) && steps.container.outputs.needs_record == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          bash scripts/release-container.sh record \
            "${{ steps.publication.outputs.tag }}" \
            "${{ steps.publication.outputs.digest_asset }}" \
            "${{ steps.verified_image.outputs.digest }}"

      - name: Publish GitHub Release
        if: github.ref_type == 'tag' || inputs.publish == true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="${{ steps.publication.outputs.tag }}"
          gh release edit "$tag" --draft=false --latest

      - name: Move latest container tag after the GitHub Release is public
        if: github.ref_type == 'tag' || inputs.publish == true
        shell: bash
        run: |
          version="${{ steps.publication.outputs.version }}"
          docker buildx imagetools create \
            --tag "ghcr.io/${GITHUB_REPOSITORY}:latest" \
            "ghcr.io/${GITHUB_REPOSITORY}:${version}@${{ steps.verified_image.outputs.digest }}"
