name: Node CI

on:
  workflow_dispatch:
  push:
    paths:
      - "node/**"
      - "scripts/build-release.sh"
      - "scripts/install.ps1"
      - "scripts/install.sh"
      - "tests/installers_e2e.mjs"
      - "tests/node_channel_test.mjs"
      - "tests/ssh_relay_test.mjs"
  pull_request:
    paths:
      - "node/**"
      - "scripts/build-release.sh"
      - "scripts/install.ps1"
      - "scripts/install.sh"
      - "tests/installers_e2e.mjs"
      - "tests/node_channel_test.mjs"
      - "tests/ssh_relay_test.mjs"

permissions:
  contents: read

jobs:
  embedded-openssh:
    uses: ./.github/workflows/openssh.yml

  checks:
    needs: embedded-openssh
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - uses: actions/setup-go@v7
        with:
          go-version-file: node/go.mod
          cache-dependency-path: node/go.sum

      - name: Install server dependencies
        run: npm ci --prefix server

      - name: Check Node integration JavaScript
        run: |
          npm run check --prefix server
          node --test tests/codex_release_test.mjs tests/codex_runtime_ui_test.mjs
          node --test tests/node_channel_test.mjs tests/ssh_relay_test.mjs

      - name: Test Mira Node
        working-directory: node
        run: go test -race ./...

      - name: Cross-compile Mira Node
        working-directory: node
        run: |
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -o /tmp/mira-node.exe ./cmd/mira-node
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -o /tmp/mira.exe ./cmd/mira
          GOOS=android GOARCH=arm64 CGO_ENABLED=0 go build -o /tmp/mira-node-android ./cmd/mira-node

      - uses: actions/download-artifact@v4
        with:
          pattern: openssh-*-amd64
          path: ${{ runner.temp }}/native
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          name: openssh-linux-arm64
          path: ${{ runner.temp }}/native

      - name: Stage verified native bundles
        shell: bash
        run: |
          for target in linux-amd64 linux-arm64 windows-amd64; do
            mkdir -p "node/openssh/out/$target"
            tar -xzf "$RUNNER_TEMP/native/openssh-$target.tar.gz" -C "node/openssh/out/$target"
          done

      - name: Build release archives and test installers
        run: |
          ./scripts/build-release.sh dist
          node tests/installers_e2e.mjs

      - name: Build integration Server container
        run: docker build -t mira-control:node-ci ./server

      - name: Test embedded OpenSSH through Mira transport
        env:
          MIRA_SECURE_COOKIES: "false"
        run: |
          docker compose -f compose.yaml up -d --wait postgres
          trap 'docker rm -f mira-node-ci-control >/dev/null 2>&1 || true; docker compose -f compose.yaml down -v' EXIT
          printf '%s\n' 'mira-local-admin-password' | npm run admin --prefix server -- set-password admin
          docker run -d --name mira-node-ci-control --network host \
            -e DATABASE_URL=postgresql://mira:mira-local@127.0.0.1:55432/mira \
            -e MIRA_SECURE_COOKIES=false -e LISTEN_HOST=127.0.0.1 \
            mira-control:node-ci
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:8787/healthz >/dev/null; then break; fi
            if [ "$attempt" -eq 40 ]; then docker logs mira-node-ci-control; exit 1; fi
            sleep 0.5
          done
          MIRA_TEST_DATABASE_URL=postgresql://mira:mira-local@127.0.0.1:55432/mira MIRA_TEST_LINUX_SINGLEFILE="$PWD/node/openssh/out/linux-amd64/mira-node" node node/openssh/tests/e2e.mjs

  windows-native:
    strategy:
      matrix:
        os: [windows-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: node/go.mod
          cache-dependency-path: node/go.sum
      - name: Test native Windows capabilities and ConPTY
        working-directory: node
        run: go test -v ./...
