name: Unified Mira CI

on:
  workflow_dispatch:
  push:
    paths:
      - "node/**"
      - "package.json"
      - "package-lock.json"
      - "scripts/build-release.sh"
      - "scripts/install.ps1"
      - "scripts/install.sh"
      - "scripts/release-container.sh"
      - "scripts/release-state.sh"
      - "tests/installers_e2e.mjs"
      - "tests/release_publication_test.mjs"
      - "node/openssh/tests/e2e.mjs"
      - ".github/workflows/node-ci.yml"
      - ".github/workflows/promote-release.yml"
      - ".github/workflows/release.yml"
  pull_request:
    paths:
      - "node/**"
      - "package.json"
      - "package-lock.json"
      - "scripts/build-release.sh"
      - "scripts/install.ps1"
      - "scripts/install.sh"
      - "scripts/release-container.sh"
      - "scripts/release-state.sh"
      - "tests/installers_e2e.mjs"
      - "tests/release_publication_test.mjs"
      - "node/openssh/tests/e2e.mjs"
      - ".github/workflows/node-ci.yml"
      - ".github/workflows/promote-release.yml"
      - ".github/workflows/release.yml"

permissions:
  contents: read

jobs:
  embedded-openssh:
    uses: ./.github/workflows/openssh.yml

  checks:
    needs: embedded-openssh
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: actions/setup-go@v7
        with:
          go-version-file: node/go.mod
          cache-dependency-path: node/go.sum

      - name: Install JavaScript test dependencies
        run: npm ci --ignore-scripts

      - name: Verify checked-in browser dependencies
        run: |
          cmp node_modules/@xterm/xterm/lib/xterm.mjs node/internal/webassets/web/vendor/xterm.js
          cmp node_modules/@xterm/xterm/css/xterm.css node/internal/webassets/web/vendor/xterm.css
          cmp node_modules/@xterm/addon-fit/lib/addon-fit.mjs node/internal/webassets/web/vendor/xterm-addon-fit.js
          cmp node_modules/marked/lib/marked.esm.js node/internal/webassets/web/vendor/marked.js
          cmp node_modules/dompurify/dist/purify.es.mjs node/internal/webassets/web/vendor/dompurify.js

      - name: Check release integration JavaScript
        run: >-
          node --test tests/codex_release_test.mjs tests/codex_runtime_ui_test.mjs
          tests/release_publication_test.mjs node/openssh/windows/source-transform.test.mjs

      - name: Test unified Mira program
        working-directory: node
        run: go test -race ./...

      - name: Cross-compile Mira
        working-directory: node
        run: |
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -o /tmp/mira.exe ./cmd/mira
          GOOS=android GOARCH=arm64 CGO_ENABLED=0 go build -o /tmp/mira-android ./cmd/mira

      - uses: actions/download-artifact@v4
        with:
          pattern: openssh-*-amd64
          path: ${{ runner.temp }}/native
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          name: openssh-linux-arm64
          path: ${{ runner.temp }}/native

      - name: Stage verified native bundles
        shell: bash
        run: |
          for target in linux-amd64 linux-arm64 windows-amd64; do
            mkdir -p "node/openssh/out/$target"
            tar -xzf "$RUNNER_TEMP/native/openssh-$target.tar.gz" -C "node/openssh/out/$target"
          done

      - name: Build release archives and test initial bootstrap
        run: |
          ./scripts/build-release.sh dist
          node tests/installers_e2e.mjs

      - name: Build the Node-free unified Mira image
        run: docker build --build-arg MIRA_VERSION="$(cat VERSION)" -f node/Dockerfile -t mira:ci .

      - name: Test embedded OpenSSH through the Go Server
        env:
          MIRA_TEST_DATABASE_URL: postgresql://mira:mira-local@127.0.0.1:55432/mira
          MIRA_TEST_LINUX_SINGLEFILE: ${{ github.workspace }}/node/openssh/out/linux-amd64/mira
        run: |
          docker compose -f compose.yaml up -d --wait postgres
          trap 'docker compose -f compose.yaml down -v' EXIT
          node node/openssh/tests/e2e.mjs
          sudo env \
            MIRA_TEST_DATABASE_URL="$MIRA_TEST_DATABASE_URL" \
            MIRA_TEST_LINUX_SINGLEFILE="$MIRA_TEST_LINUX_SINGLEFILE" \
            MIRA_OPENSSH_TEST_PORT=18881 \
            MIRA_OPENSSH_TEST_NO_PASSWD_TARGET=1 \
            "$(command -v node)" node/openssh/tests/e2e.mjs

          capless_stage=$(mktemp -d /tmp/mira-capless-e2e.XXXXXX)
          mkdir -p "$capless_stage/node/openssh/tests" "$capless_stage/tests"
          cp node/openssh/tests/e2e.mjs "$capless_stage/node/openssh/tests/"
          cp tests/auth_helpers.mjs tests/runtime_fixture_cleanup.mjs "$capless_stage/tests/"
          cp package.json "$capless_stage/"
          cp -a node_modules "$capless_stage/"
          cp "$(command -v node)" "$capless_stage/node-runtime"
          cp "$MIRA_TEST_LINUX_SINGLEFILE" "$capless_stage/mira"
          chmod -R a+rX "$capless_stage"
          sudo capsh --drop=all --caps= --no-new-privs -- -c "
            cd '$capless_stage'
            test \"\$(awk '/^CapEff:/{print \$2}' /proc/self/status)\" = 0000000000000000
            test \"\$(awk '/^CapBnd:/{print \$2}' /proc/self/status)\" = 0000000000000000
            env MIRA_TEST_DATABASE_URL='$MIRA_TEST_DATABASE_URL' \
              MIRA_TEST_LINUX_SINGLEFILE='$capless_stage/mira' \
              MIRA_OPENSSH_TEST_PORT=18880 \
              '$capless_stage/node-runtime' node/openssh/tests/e2e.mjs
          "

  windows-native:
    strategy:
      matrix:
        os: [windows-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: node/go.mod
          cache-dependency-path: node/go.sum
      - name: Test native Windows capabilities and Supervisor
        working-directory: node
        run: go test -v ./...
      - name: Reject the removed installer update path
        shell: pwsh
        run: |
          try {
            & scripts/install.ps1 -Update
            throw "legacy installer update unexpectedly succeeded"
          } catch {
            if ("$_" -notmatch "Installer-driven updates were removed") { throw }
          }
      - name: Test Windows tray startup, close, duplicate launch and exit
        shell: pwsh
        run: |
          go -C node build -o "$env:RUNNER_TEMP/mira-tray.exe" ./cmd/mira
          & tests/windows_tray_e2e.ps1 -Binary "$env:RUNNER_TEMP/mira-tray.exe"
