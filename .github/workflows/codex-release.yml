name: Codex runtime release

on:
  push:
    branches: [main]
    tags:
      - "codex-v*"
    # Release tags can restore default-branch caches, but not another tag's cache.
    # Only runtime changes warm this expensive lane; Web/Server changes do not.
    paths:
      - CODEX_VERSION
      - patches/codex/**
      - node/internal/codex-runtime.json
      - tests/runtime_fixture_cleanup*.mjs
      - tests/interrupted_tool_resume_e2e.py
      - tests/encrypted_context_runtime_e2e.py
      - tests/plaintext_context_runtime_e2e.py
      - tests/image_compaction_runtime_e2e.py
      - tests/reasoning_recovery_runtime_e2e.py
      - tests/codex_release_test.mjs
      - scripts/build-codex-release.mjs
      - .github/workflows/codex-release.yml
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the pinned independent runtime (never mark as latest Mira)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  codex:
    # Native builds run only on the owner's self-hosted machines (Desktop WSL and
    # Windows; see docs/codex-build-runners.md). They execute with local access, so
    # only the owner's own pushes and dispatches may schedule them. There is no
    # pull_request trigger, and fork pull requests always require approval.
    if: github.repository == 'ssine/mira' && github.actor == 'ssine' && github.triggering_actor == 'ssine'
    timeout-minutes: 240
    concurrency:
      group: mira-codex-build-${{ matrix.target }}
      cancel-in-progress: false
    env:
      STABLE_GIT_COMMIT: ${{ github.sha }}
      RUST_TOOLCHAIN: "1.95.0"
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: mira-codex-linux
            target: x86_64-unknown-linux-musl
            package: mira-codex-package-linux-amd64
          - runner: mira-codex-windows
            target: x86_64-pc-windows-msvc
            package: mira-codex-package-windows-amd64
    runs-on: [self-hosted, "${{ matrix.runner }}"]
    steps:
      # The runner resolves `bash` from GITHUB_PATH before its own PATH. Without
      # this, System32\bash.exe (the WSL launcher) would run every bash step,
      # including those inside composite actions. Host paths are documented in
      # docs/codex-build-runners.md.
      - name: Use Git Bash, Python 3.13 and D:\ Rust homes on Windows
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($dir in 'C:\Program Files\Python313\Scripts', 'C:\Program Files\Python313', 'C:\Program Files\Git\bin') {
            if (-not (Test-Path $dir)) { throw "Missing build prerequisite: $dir" }
            Add-Content -Encoding utf8 -Path $env:GITHUB_PATH -Value $dir
          }
          Add-Content -Encoding utf8 -Path $env:GITHUB_ENV -Value 'CARGO_HOME=D:\actions-runner\cargo'
          Add-Content -Encoding utf8 -Path $env:GITHUB_ENV -Value 'RUSTUP_HOME=D:\actions-runner\rustup'

      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Validate Codex runtime lock
        run: node scripts/check-codex-runtime.mjs

      - name: Check build machine prerequisites
        shell: bash
        run: |
          set -euo pipefail
          python -c 'import sys; assert sys.version_info >= (3, 11), sys.version'
          python --version; git --version; node --version
          if [[ "$RUNNER_OS" == Windows ]]; then
            # Actions resolves `bash` from PATH; System32\bash.exe would start WSL instead.
            [[ "$(uname -s)" == MINGW* || "$(uname -s)" == MSYS* ]]
          fi

      # The persistent tree lives outside the checkout, which actions/checkout cleans.
      # Cargo fingerprints key every artifact by toolchain, source and flags; final
      # binaries are deleted before each build so every package is freshly linked.
      - name: Prepare persistent patched Codex source and build cache
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          codex_version=$(<CODEX_VERSION)
          root="$RUNNER_TOOL_CACHE/mira-codex"
          [[ "$RUNNER_OS" == Windows ]] && root="$(cygpath -m "$RUNNER_TOOL_CACHE")/mira-codex"
          src="$root/upstream-codex"
          target_dir="$root/target-$TARGET-rust$RUST_TOOLCHAIN"
          mkdir -p "$root"
          if [[ ! -d "$src/.git" ]]; then
            git init -q "$src"
            git -C "$src" config core.autocrlf false
            git -C "$src" config core.longpaths true
            git -C "$src" remote add origin https://github.com/openai/codex.git
          fi
          git -C "$src" fetch -q --depth 1 --no-tags origin "+refs/tags/rust-v${codex_version}:refs/tags/rust-v${codex_version}"
          git -C "$src" checkout -q -f --detach "rust-v${codex_version}"
          git -C "$src" clean -q -ffdx
          git -C "$src" apply "$GITHUB_WORKSPACE/patches/codex/0001-feat-thread-store-add-remote-PostgreSQL-adapter.patch"
          # Bound the cache: drop it when it outgrows 80 GiB instead of pruning piecemeal.
          if [[ -d "$target_dir" ]] && (( $(du -sk "$target_dir" | cut -f1) > 80 * 1024 * 1024 )); then
            rm -rf "$target_dir"
          fi
          rm -rf "$target_dir/cargo-timings"
          for binary in codex codex-code-mode-host bwrap codex-command-runner codex-windows-sandbox-setup; do
            rm -f "$target_dir/$TARGET/release/$binary" "$target_dir/$TARGET/release/$binary.exe"
          done
          {
            echo "CODEX_SRC=$src"
            echo "CARGO_TARGET_DIR=$target_dir"
            echo "CODEX_RELEASE_DIR=$target_dir/$TARGET/release"
          } >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.target }}

      - if: runner.os == 'Linux'
        uses: mlugg/setup-zig@v2
        with:
          version: 0.14.0
          use-cache: false

      - name: Install Linux MUSL toolchain
        if: runner.os == 'Linux'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends binutils libcap-dev pkg-config
          bash "$CODEX_SRC/.github/scripts/install-musl-build-tools.sh"

      - name: Configure verified Codex rusty_v8 artifacts
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          version=$(python "$CODEX_SRC/.github/scripts/rusty_v8_bazel.py" resolved-v8-crate-version)
          base_url="https://github.com/openai/codex/releases/download/rusty-v8-v${version}"
          artifact_dir="$RUNNER_TOOL_CACHE/mira-rusty-v8/${version}"
          [[ "$RUNNER_OS" == Windows ]] && artifact_dir="$(cygpath -m "$RUNNER_TOOL_CACHE")/mira-rusty-v8/${version}"
          profile=ptrcomp_sandbox_release
          mkdir -p "$artifact_dir"
          if [[ "$TARGET" == *windows* ]]; then
            archive="rusty_v8_${profile}_${TARGET}.lib.gz"
          else
            archive="librusty_v8_${profile}_${TARGET}.a.gz"
          fi
          binding="src_binding_${profile}_${TARGET}.rs"
          checksums="rusty_v8_${profile}_${TARGET}.sha256"
          for file in "$archive" "$binding"; do
            if [[ ! -s "$artifact_dir/$file" ]]; then
              curl --retry 5 --retry-all-errors -fsSL "$base_url/$file" -o "$artifact_dir/$file.part"
              mv "$artifact_dir/$file.part" "$artifact_dir/$file"
            fi
          done
          # Re-fetch authoritative digests and verify even when the files are cached.
          curl --retry 5 --retry-all-errors -fsSL "$base_url/$checksums" -o "$artifact_dir/$checksums"
          (cd "$artifact_dir" && tr -d '\r' < "$checksums" | sha256sum -c -)
          echo "RUSTY_V8_ARCHIVE=$artifact_dir/$archive" >> "$GITHUB_ENV"
          echo "RUSTY_V8_SRC_BINDING_PATH=$artifact_dir/$binding" >> "$GITHUB_ENV"

      - name: Build Linux sandbox resource
        if: runner.os == 'Linux'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          export AWS_LC_SYS_NO_JITTER_ENTROPY=1
          target_no_jitter="AWS_LC_SYS_NO_JITTER_ENTROPY_${TARGET//-/_}"
          export "$target_no_jitter=1"
          (cd "$CODEX_SRC/codex-rs" && cargo build --timings \
            --target "$TARGET" --release --locked --bin bwrap)
          bwrap="$CODEX_RELEASE_DIR/bwrap"
          strip --strip-debug --strip-unneeded "$bwrap"
          digest=$(sha256sum "$bwrap" | awk '{print $1}')
          echo "CODEX_BWRAP_SHA256=$digest" >> "$GITHUB_ENV"

      - name: Build Mira-compatible Codex
        timeout-minutes: 210
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          build_args=(--bin codex --bin codex-code-mode-host)
          if [[ "$TARGET" == "x86_64-pc-windows-msvc" ]]; then
            export LIBSQLITE3_FLAGS=SQLITE_DISABLE_INTRINSIC
            build_args+=(--bin codex-command-runner --bin codex-windows-sandbox-setup)
          else
            export AWS_LC_SYS_NO_JITTER_ENTROPY=1
            target_no_jitter="AWS_LC_SYS_NO_JITTER_ENTROPY_${TARGET//-/_}"
            export "$target_no_jitter=1"
          fi
          # Build from the workspace so upstream target flags (e.g. static MSVC CRT) apply.
          (cd "$CODEX_SRC/codex-rs" && cargo build --timings \
            --target "$TARGET" --release --locked "${build_args[@]}")

      - name: Preserve build timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codex-build-diagnostics-${{ matrix.target }}
          path: ${{ env.CARGO_TARGET_DIR }}/cargo-timings/
          if-no-files-found: ignore
          retention-days: 14

      - name: Strip Linux release binaries
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          for binary in codex codex-code-mode-host; do
            strip --strip-debug --strip-unneeded "$CODEX_RELEASE_DIR/$binary"
          done

      - name: Assemble canonical Codex package
        id: package
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          PACKAGE: ${{ matrix.package }}
        run: |
          set -euo pipefail
          export CODEX_REPO_ROOT="$CODEX_SRC"
          codex_version=$(<CODEX_VERSION)
          rm -rf "$GITHUB_WORKSPACE/$PACKAGE"
          suffix=""
          [[ "$TARGET" == *windows* ]] && suffix=".exe"
          arguments=(
            --target "$TARGET"
            --package-version "$codex_version"
            --package-dir "$GITHUB_WORKSPACE/$PACKAGE"
            --entrypoint-bin "$CODEX_RELEASE_DIR/codex${suffix}"
            --code-mode-host-bin "$CODEX_RELEASE_DIR/codex-code-mode-host${suffix}"
          )
          if [[ "$TARGET" == *windows* ]]; then
            arguments+=(
              --codex-command-runner-bin "$CODEX_RELEASE_DIR/codex-command-runner.exe"
              --codex-windows-sandbox-setup-bin "$CODEX_RELEASE_DIR/codex-windows-sandbox-setup.exe"
            )
          else
            arguments+=(--bwrap-bin "$CODEX_RELEASE_DIR/bwrap")
          fi
          python "$CODEX_SRC/scripts/build_codex_package.py" "${arguments[@]}"
          mkdir -p "$GITHUB_WORKSPACE/codex-upstream-notices"
          cp "$CODEX_SRC/LICENSE" "$CODEX_SRC/NOTICE" "$GITHUB_WORKSPACE/codex-upstream-notices/"

      - name: Test runtime fixture cleanup
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/runtime_fixture_cleanup_test.mjs

      - name: Test interrupted tool recovery in the release runtime
        shell: bash
        env:
          PACKAGE: ${{ matrix.package }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          suffix=""
          [[ "$TARGET" == *windows* ]] && suffix=".exe"
          CODEX_TEST_BINARY="$GITHUB_WORKSPACE/$PACKAGE/bin/codex${suffix}" python tests/interrupted_tool_resume_e2e.py

      - name: Test encrypted context errors and transient retries in the release runtime
        shell: bash
        env:
          PACKAGE: ${{ matrix.package }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          suffix=""
          [[ "$TARGET" == *windows* ]] && suffix=".exe"
          CODEX_TEST_BINARY="$GITHUB_WORKSPACE/$PACKAGE/bin/codex${suffix}" python tests/encrypted_context_runtime_e2e.py

      - name: Test default plaintext communication and compaction in the release runtime
        shell: bash
        env:
          PACKAGE: ${{ matrix.package }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          suffix=""
          [[ "$TARGET" == *windows* ]] && suffix=".exe"
          CODEX_TEST_BINARY="$GITHUB_WORKSPACE/$PACKAGE/bin/codex${suffix}" python tests/plaintext_context_runtime_e2e.py

      - name: Test conditional reasoning recovery in the release runtime
        shell: bash
        env:
          PACKAGE: ${{ matrix.package }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          suffix=""
          [[ "$TARGET" == *windows* ]] && suffix=".exe"
          CODEX_TEST_BINARY="$GITHUB_WORKSPACE/$PACKAGE/bin/codex${suffix}" python tests/reasoning_recovery_runtime_e2e.py

      - name: Test image-count checkpoints in the release runtime
        shell: bash
        env:
          PACKAGE: ${{ matrix.package }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          suffix=""
          [[ "$TARGET" == *windows* ]] && suffix=".exe"
          CODEX_TEST_BINARY="$GITHUB_WORKSPACE/$PACKAGE/bin/codex${suffix}" python tests/image_compaction_runtime_e2e.py

      - uses: actions/upload-artifact@v4
        # Retain a completed candidate for diagnosis even if acceptance fails.
        # The release job and promotion validator still require passing jobs.
        if: always() && steps.package.outcome == 'success'
        with:
          name: mira-codex-${{ matrix.target }}
          path: ${{ matrix.package }}
          if-no-files-found: error
          retention-days: 7

      - uses: actions/upload-artifact@v4
        if: always() && steps.package.outcome == 'success' && matrix.target == 'x86_64-unknown-linux-musl'
        with:
          name: codex-upstream-notices
          path: codex-upstream-notices/
          if-no-files-found: error

  release:
    needs: codex
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: mira-codex-*
          path: codex-dist
      - uses: actions/download-artifact@v4
        with:
          name: codex-upstream-notices
          path: notices
      - name: Package independent runtimes
        run: |
          node scripts/build-codex-release.mjs codex-release \
            linux-amd64=codex-dist/mira-codex-x86_64-unknown-linux-musl \
            windows-amd64=codex-dist/mira-codex-x86_64-pc-windows-msvc
          cp notices/LICENSE codex-release/LICENSE
          cp notices/NOTICE codex-release/NOTICE
          (cd codex-release && sha256sum LICENSE NOTICE >> SHA256SUMS)
          version=$(node -p "require('./node/internal/codex-runtime.json').version")
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "codex-v$version" ]]; then
            echo "Codex tag does not match runtime lock" >&2; exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: mira-codex-release
          path: codex-release/*
          if-no-files-found: error
          retention-days: 14
      - name: Publish immutable Codex runtime, separately from Mira latest
        if: github.ref_type == 'tag' || inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./node/internal/codex-runtime.json').version")
          tag="codex-v$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Runtime already exists; bump the Mira patch revision, never overwrite" >&2; exit 1
          fi
          if git rev-parse "$tag" >/dev/null 2>&1; then
            test "$(git rev-parse "$tag^{commit}")" = "$(git rev-parse HEAD)"
          else
            git tag "$tag"
            git push origin "$tag"
          fi
          gh release create "$tag" codex-release/* --verify-tag --latest=false \
            --title "Mira-compatible Codex $version" \
            --notes "Independent optional Codex runtime. Keep each complete canonical package together. This is not a Mira Node/Server/APK update. Upstream LICENSE and NOTICE accompany the assets; source baseline and patch are recorded in codex-runtime.json and this tag."
