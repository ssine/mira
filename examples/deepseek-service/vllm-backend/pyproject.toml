[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deepseek-recipe-vllm-images"
version = "0.1.1"
description = "Loopback raw-token image completions for the standalone Recipe service"
requires-python = ">=3.10"

[project.entry-points."vllm.endpoint_plugins"]
deepseek_recipe_images = "recipe_images_backend:RecipeImagesPlugin"

[tool.setuptools]
py-modules = ["recipe_images_backend"]
