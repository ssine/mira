name: mira

services:
  server:
    image: ghcr.io/ssine/mira:${MIRA_VERSION:?pin a released Mira version in .env}
    restart: unless-stopped
    command: ["mira", "server-worker"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?set an external PostgreSQL URL in .env}
      LISTEN_HOST: 0.0.0.0
      LISTEN_PORT: "8787"
      MIRA_SECURE_COOKIES: "true"
      MIRA_CODEX_STORE_ENDPOINT: ${MIRA_CODEX_STORE_ENDPOINT:?set the public HTTPS Mira URL in .env}
      # Safe only because the published port is loopback-only and Caddy is the
      # sole network-facing caller.
      MIRA_TRUST_PROXY_HEADERS: "true"
      MIRA_SSH_MAX_SESSIONS: "128"
      MIRA_SSH_MAX_SESSIONS_PER_NODE: "32"
    ports:
      - "127.0.0.1:8787:8787"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8787/healthz"]
      interval: 2s
      timeout: 3s
      retries: 20

  # This profile is for isolation tests only. A Home Server that should expose
  # host files/processes runs its Node through `mira install --role server`.
  node:
    image: ghcr.io/ssine/mira:${MIRA_VERSION:?pin a released Mira version in .env}
    profiles: ["container-node"]
    restart: unless-stopped
    command: ["mira-node"]
    environment:
      MIRA_SERVER_URL: http://server:8787
      MIRA_NODE_KEY: mira-homeserver-docker
      MIRA_IDENTITY_FILE: /home/node/.config/mira/identity.json
      MIRA_NODE_HEARTBEAT_SECONDS: "1"
      APP_SERVER_CODEX_HOME: /home/node/.codex
      APP_SERVER_LISTEN_URL: ws://127.0.0.1:4510
    volumes:
      - homeserver-codex-home:/home/node/.codex
      - homeserver-node-identity:/home/node/.config/mira
    depends_on:
      server:
        condition: service_healthy

volumes:
  homeserver-codex-home:
  homeserver-node-identity:
