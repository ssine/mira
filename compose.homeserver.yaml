name: mira

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: mira
      POSTGRES_USER: mira
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mira -d mira"]
      interval: 2s
      timeout: 3s
      retries: 20

  control:
    build: ./server
    environment:
      DATABASE_URL: postgresql://mira:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/mira
      LISTEN_HOST: 0.0.0.0
      LISTEN_PORT: "8787"
      THREAD_STORE_TOKEN: ${THREAD_STORE_TOKEN:?set THREAD_STORE_TOKEN in .env}
    ports:
      - "0.0.0.0:8787:8787"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8787/healthz').then(r=>{if(!r.ok)process.exit(1)})",
        ]
      interval: 2s
      timeout: 3s
      retries: 20

  node-agent:
    build: ./node-agent
    environment:
      CONTROL_SERVER_URL: http://control:8787
      CONTROL_SERVER_TOKEN: ${THREAD_STORE_TOKEN:?set THREAD_STORE_TOKEN in .env}
      NODE_AGENT_KEY: mira-homeserver-docker
      NODE_AGENT_HEARTBEAT_SECONDS: "1"
      NODE_AGENT_ALLOWED_ROOTS: '["/home/node"]'
      APP_SERVER_CODEX_HOME: /home/node/.codex
      APP_SERVER_LISTEN_URL: ws://127.0.0.1:4510
    volumes:
      - homeserver-codex-home:/home/node/.codex
    depends_on:
      control:
        condition: service_healthy

volumes:
  postgres-data:
  homeserver-codex-home:
