name: mira-local

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: mira
      POSTGRES_USER: mira
      POSTGRES_PASSWORD: mira-local
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U mira -d mira"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
    name: mira-local-postgres-data
